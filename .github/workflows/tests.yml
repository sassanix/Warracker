name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: warranty_user
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warranty_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: warranty_test_suite
      DB_USER: warranty_user
      DB_PASSWORD: ci-test-password
      SECRET_KEY: ci-test-secret-key
      UPLOAD_FOLDER: /tmp/warracker-test-uploads

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q
