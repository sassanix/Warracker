server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    # Point root to the frontend directory where static assets reside inside the container
    root /var/www/html;
    index index.html;
    
    # Security headers (CFG-07a/b/d). These apply to the pages nginx
    # serves directly; the Flask app sets the same headers on API
    # responses, which pass through the proxy untouched. Keep the CSP
    # value identical to _CONTENT_SECURITY_POLICY in backend/__init__.py.
    # Locations below that define their own add_header directives do
    # not inherit these, so the HTML location repeats them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.buymeacoffee.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.buymeacoffee.com https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.github.com; frame-src 'self' https://*.buymeacoffee.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Suppress the nginx version number in error pages and the Server
    # header (CFG-08). Valid in the server context; this file is
    # included as the default server block.
    server_tokens off;

    # Send nginx errors to stderr so they appear in `docker logs`
    # alongside the app output; access logs stay in their file.
    error_log /dev/stderr warn;
    access_log /var/log/nginx/access.log;
    
    # Global settings
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    client_max_body_size __NGINX_MAX_BODY_SIZE_CONFIG_VALUE__; # Configurable global limit
    
    # Add CORS headers globally
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    
    # MIME types - fixed duplicate js entry
    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/svg+xml                         svg svgz;
        application/pdf                       pdf;
        image/x-icon                          ico;
        application/json                      json;
        application/manifest+json             webmanifest manifest;
        font/woff2                            woff2;
        font/woff                             woff;
        font/ttf                              ttf;
    }
    
    # Specific location for locales JSON files
    location /locales/ {
        alias /var/www/html/locales/;
        try_files $uri =404;
        add_header Content-Type "application/json; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    
    # API requests - proxy to backend (fixed upstream host)
    # Using ^~ to ensure this prefix match takes precedence over regex extension matches
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000; # Removed trailing slash to pass /api/ prefix
        # Use $http_host (not $host) so the original client port is preserved.
        # $host drops the port, which broke OIDC redirect_uri generation
        # (issue #238) for anyone serving Warracker on a nonstandard port.
        proxy_set_header Host $http_host;
        # Pass through the outer proxy's scheme when present (issues #190/#97).
        # An empty value means nginx omits the header, so gunicorn falls back
        # to the direct connection scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Clear the other scheme headers: gunicorn 400s on contradictory
        # scheme headers, and a single X-Forwarded-Proto is unambiguous.
        # (Empty values are not sent by nginx.)
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size __NGINX_MAX_BODY_SIZE_CONFIG_VALUE__; # Configurable limit for API location
        
        # Pass Authorization header to backend
        proxy_set_header Authorization $http_authorization;
        
        # Enhanced proxy settings for file handling
        proxy_buffering off; # Disable buffering for file downloads to prevent content-length mismatches
        proxy_request_buffering off; # Disable request buffering for uploads
        proxy_read_timeout 300s; # Increased timeout for large file transfers
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        
        # Prevent proxy from modifying response headers that could cause issues
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Add debug headers to see what's happening
        add_header X-Debug-Message "API request proxied to backend" always;
        
        # CORS for API
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain charset=UTF-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
    }
    
    # Uploads - serve files from uploads directory
    location /uploads/ {
        return 403 "Access forbidden";
    }
    
    # HTML files - ensure proper content type
    location ~ \.html$ {
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Repeated: locations with their own add_header do not inherit
        # the server-level security headers (CFG-07a/b/d).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.buymeacoffee.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.buymeacoffee.com https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.github.com; frame-src 'self' https://*.buymeacoffee.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    
    # Favicon - specific handling
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    
    # Service Worker - no cache to ensure updates
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # JavaScript files - short cache with revalidation so module updates are picked up promptly
    location ~* \.js$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets (CSS, images) - long cache is fine since these change rarely
    location ~* \.(css|jpg|jpeg|png|gif|ico|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    
    # Test uploads path
    location = /test-uploads {
        add_header Content-Type text/plain;
        return 200 "Uploads directory exists: $document_root\n";
    }

    # Specific handling for manifest.json
    location = /manifest.json {
        alias /var/www/html/manifest.json; # Serve from this specific path
        # The global types block should set the correct Content-Type
        # (application/manifest+json for 'manifest' extension)
        # If not found by alias, it will result in a 404, which is correct.
        # No need for try_files here if alias is used and file must exist.
        # If you want to be explicit about 404 if alias target doesn't exist:
        # if (!-f /var/www/html/manifest.json) { return 404; }
        # However, alias itself should handle this.
        # Add caching headers if desired, e.g.:
        # expires 1d;
        # add_header Cache-Control "public, must-revalidate";
    }
    
    # Default location
    location / {
        try_files $uri $uri/ /index.html;
    }
}
